---
- name: Executar Query de Teste no IBM Db2
  hosts: all
  gather_facts: false

  vars:
    db_name: "BRADESCO"
    db_user: "{{ ansible_user }}"
    db_pass: "{{ ansible_password }}"
    db_port: "{{ db2_port | default(50000) }}"
    db_host: "{{ ansible_host }}"

  tasks:
    - name: Executar query SELECT CURRENT TIMESTAMP via Db2 CLI
      shell: |
#        db2 attach to {{ db_host }} user {{ db_user }} using '{{ db_pass }}'
        db2 connect to {{ db_name }}
        db2 "SELECT CURRENT TIMESTAMP FROM SYSIBM.SYSDUMMY1"
        db2 connect reset
        db2 detach
      register: query_result
      no_log: true # Mantém a senha protegida nesta task

    - name: Exibir o resultado da consulta SQL
      debug:
        msg: "{{ query_result.stdout_lines }}"
